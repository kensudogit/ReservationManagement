services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: rm-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: OraclePass123
      APP_USER: receivables
      APP_USER_PASSWORD: receivables
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: receivables
      SPRING_DATASOURCE_PASSWORD: receivables
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rm-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  oracle-data:
