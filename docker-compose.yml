services:
  postgres:
    image: postgres:16-alpine
    container_name: rm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: receivables
      POSTGRES_USER: receivables
      POSTGRES_PASSWORD: receivables
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receivables -d receivables"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/receivables
      SPRING_DATASOURCE_USERNAME: receivables
      SPRING_DATASOURCE_PASSWORD: receivables
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rm-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres-data:
