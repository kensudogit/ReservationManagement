server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: receivables-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/receivables}
    username: ${SPRING_DATASOURCE_USERNAME:receivables}
    password: ${SPRING_DATASOURCE_PASSWORD:receivables}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

logging:
  level:
    com.receivables: INFO
    org.hibernate.SQL: DEBUG
